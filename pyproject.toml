[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flux-agent"
version = "0.1.0"
description = "AI Agent Runtime Platform — Deploy, run, and manage AI agents 24/7"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Kelly", email = "kelly@flux.ai.kr" }
]
keywords = ["ai", "agent", "runtime", "llm", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.45.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.60.0"]
google = ["google-generativeai>=0.5.0"]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
]
all = [
    "openai>=1.60.0",
    "google-generativeai>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
flux = "flux.cli:cli"

[project.urls]
Homepage = "https://flux.ai.kr"
Repository = "https://github.com/jeromwolf/flux"

[tool.hatch.build.targets.wheel]
packages = ["src/flux"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
